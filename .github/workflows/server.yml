# API (server/) pipeline. See docs/deployment.md and ADR-0009.
#   pull request        -> test
#   push to release/**  -> test, build image, deploy to the test droplet
#   manual run          -> same as push; with `tag` set, skip test/build and redeploy that image (rollback)
name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: ["release/**"]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (git SHA) to redeploy. Leave empty to test, build and deploy this commit."
        required: false
        default: ""

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ex

jobs:
  test:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
    services:
      # config/test.exs connects as postgres/postgres on localhost.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with ELIXIR_VERSION / OTP_VERSION in server/Dockerfile.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"

      - uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: mix-test-${{ runner.os }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  build:
    needs: test
    if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repo, so the deploy job's token can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Runs after a successful build, or on its own for a manual redeploy of an existing tag.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag)) }}
    runs-on: ubuntu-24.04
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # Secrets stay on the droplet (/opt/ex/.env); only these files are copied.
      - name: Copy compose files
        run: |
          tar -C server -czf - \
            docker-compose.yml docker-compose.prod.yml \
            traefik/traefik.yml traefik/dynamic.yml deploy/deploy.sh \
            | ssh -o BatchMode=yes "$TARGET" 'mkdir -p /opt/ex/traefik/certs && tar -C /opt/ex -xzf -'

      # The job token is only valid while this job runs, so the droplet keeps no registry credential.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$TARGET" "
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null &&
            /opt/ex/deploy/deploy.sh '$TAG'
            status=\$?
            docker logout ghcr.io > /dev/null
            exit \$status
          "
