# API (server/) pipeline. See docs/deployment.md and ADR-0009.
#   pull request        -> test
#   push to release/**  -> test, build and push ghcr.io/<owner>/ex:<SHA> and :latest
#   manual run          -> same as push
# Deploying is manual for now: pull the image on the droplet (docs/deployment.md).
name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: ["release/**"]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ex

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
    services:
      # config/test.exs connects as postgres/postgres on localhost.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with ELIXIR_VERSION / OTP_VERSION in server/Dockerfile.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"

      - uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build
          key: mix-test-${{ runner.os }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  build:
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repo (shows on the repo page, inherits its access).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
