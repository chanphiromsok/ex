# Local/test stack: the app plus Postgres. `docker compose up --build`
# Pinned so the stack (and its pgdata volume) keeps the name it had before the app moved into server/.
name: ex

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ex
      POSTGRES_PASSWORD: ex
      POSTGRES_DB: ex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ex"]
      interval: 3s
      retries: 20

  app:
    build: .
    # CI pushes ghcr.io/<owner>/ex:<git SHA>; the droplet runs that with TAG set. Locally `--build` tags it :local.
    image: ghcr.io/chanphiromsok/ex:${TAG:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: "4000"
      DATABASE_URL: ecto://ex:ex@db/ex
      POOL_SIZE: "3"
      # Memory: load code on first use (about 100 MB less than loading every module at boot) and use
      # a tighter allocator. Scheduler count is left at the default (one per CPU).
      RELEASE_MODE: interactive
      ERL_FLAGS: "+MBas aobf +MHas aobf +MMmcs 0"
      # Local-only signing secrets so `docker compose up` works with no setup. Public, so never
      # used outside this machine: the prod overlay requires real values from .env.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-secret-key-base-local-only-secret-key-base-local-only-0000}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-local-only-token-signing-secret}
      # No default credentials. Put these in the git-ignored server/.env; when unset, no Admin is
      # seeded and /ops/dashboard answers 404.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # Local-only API docs at /api/docs.
      API_DOCS: "true"
    ports:
      - "4001:4000"
    command: sh -c "/app/bin/ex eval Ex.Release.migrate && /app/bin/ex eval Ex.Release.seed && /app/bin/server"

volumes:
  pgdata:
