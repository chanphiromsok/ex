# Production overlay: Traefik terminates TLS (Cloudflare Origin Certificate) in front of the app.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put origin.pem and origin.key (Cloudflare: SSL/TLS > Origin Server) in ./traefik/certs/.
services:
  traefik:
    # v3.2 negotiates Docker API 1.24, which Docker 29 rejects (minimum 1.40).
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80" # TEMPORARY: plain HTTP on the droplet IP
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro

  db:
    restart: unless-stopped

  app:
    # Only Traefik is reachable from outside; drops the base file's 4001:4000.
    ports: !reset []
    restart: unless-stopped
    # Migrations run as a separate deploy step (deploy/deploy.sh); nothing is seeded at startup.
    command: ["/app/bin/server"]
    environment:
      PHX_HOST: ex.pongpong.eu.org
      # Secrets come from /opt/ex/.env; refuse to start with the base file's local-only values.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?set TOKEN_SIGNING_SECRET in .env}
      # Empty unless set in .env: the dashboard then answers 404 instead of using a known password.
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`ex.pongpong.eu.org`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.services.app.loadbalancer.server.port=4000
      # TEMPORARY: plain HTTP by IP (and localhost for testing on a Mac). Remove with the :80 entrypoint.
      - traefik.http.routers.app-ip.rule=Host(`159.223.95.98`) || Host(`localhost`)
      - traefik.http.routers.app-ip.entrypoints=web
      - traefik.http.routers.app-ip.service=app
