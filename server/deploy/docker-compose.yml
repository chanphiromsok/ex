# Server stack: one file for every environment. The env file is the only thing that changes:
#   /etc/ex/uat.env   (CI writes it from server/.env.uat)   APP_HOST=159.223.95.98  APP_ENTRYPOINT=web
#   /etc/ex/prod.env  (later)                               APP_HOST=<domain>       APP_ENTRYPOINT=websecure
# Run through deploy/deploy.sh, which passes the file as --env-file and ENV_FILE.
# Local dev uses ../docker-compose.yml instead.

# Fixed project name: keeps the existing containers and the ex_pgdata volume.
name: ex

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Routers on websecure get a Let's Encrypt certificate for their Host; routers on web need nothing.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ex
      POSTGRES_PASSWORD: ex
      POSTGRES_DB: ex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ex"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/chanphiromsok/ex:${TAG:?set TAG (deploy.sh <tag>)}
    restart: unless-stopped
    command: ["/app/bin/server"]
    depends_on:
      db:
        condition: service_healthy
    # Everything in the env file reaches the app (SEED_*, DASHBOARD_*, API_DOCS, ...).
    env_file: ${ENV_FILE:?set ENV_FILE}
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-ex.pongpong.eu.org}
      PORT: "4000"
      DATABASE_URL: ecto://ex:ex@db/ex
      POOL_SIZE: "3"
      RELEASE_MODE: interactive
      ERL_FLAGS: "+MBas aobf +MHas aobf +MMmcs 0"
      # Repeated here so a missing value stops the deploy instead of booting with an unsafe default.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in the env file}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?set TOKEN_SIGNING_SECRET in the env file}
      RELEASE_COOKIE: ${RELEASE_COOKIE:?set RELEASE_COOKIE in the env file}
    labels:
      - traefik.enable=true
      # /ops (LiveDashboard) and /live are never public; reach them through an SSH tunnel.
      - traefik.http.routers.app.rule=Host(`${APP_HOST:?set APP_HOST in the env file}`) && !PathPrefix(`/ops`) && !PathPrefix(`/live`)
      - traefik.http.routers.app.entrypoints=${APP_ENTRYPOINT:-websecure}
      - traefik.http.services.app.loadbalancer.server.port=4000

volumes:
  pgdata:
  letsencrypt:
